<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MPS 진료가이드 · MPS EMR</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Pretendard', 'Apple SD Gothic Neo', 'sans-serif'],
          },
          colors: {
            // M-Report Theme
            mental: { 50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca', 800: '#3730a3' },
            // P-Report Theme
            physio: { 50: '#f0f9ff', 100: '#e0f2fe', 200: '#bae6fd', 500: '#0ea5e9', 600: '#0284c7', 700: '#0369a1', 800: '#075985' },
            // S-Report Theme
            structure: { 50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 500: '#10b981', 600: '#059669', 700: '#047857', 800: '#065f46' },
            // Login Theme
            brand: { 400: '#2dd4bf', 500: '#14b8a6', 600: '#0d9488', 900: '#0f172a' }
          }
        }
      }
    };
  </script>

  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f8fafc; color: #0f172a; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
    
    .modal-enter { animation: slideUp 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .modal-leave { animation: slideDown 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
    .fade-in { animation: fadeIn 0.4s ease-out forwards; }
    
    @keyframes slideUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    @keyframes slideDown { from { transform: translateY(0); opacity: 1; } to { transform: translateY(100%); opacity: 0; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .glass-header {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    
    .guide-card:active { transform: scale(0.98); }
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 24px); }
    
    /* Login Background */
    .login-bg {
      background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
    }
    
    /* Typography Utilities for Modals & Static Sections */
    .modal-prose h4 { font-weight: 800; color: #1e293b; margin-top: 1.5rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .modal-prose h4:first-child { margin-top: 0; }
    .modal-prose p { font-size: 0.875rem; color: #475569; line-height: 1.6; margin-bottom: 1rem; }
    .modal-prose ul { margin-bottom: 1rem; }
    .modal-prose li { font-size: 0.8125rem; color: #475569; line-height: 1.5; margin-bottom: 0.25rem; padding-left: 1rem; position: relative; }
    .modal-prose li::before { content: "•"; position: absolute; left: 0; color: #94a3b8; }
    .km-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.5rem; padding: 0.75rem; margin-bottom: 1rem; border-left: 4px solid #cbd5e1; }
    .km-box.mental { border-left-color: #6366f1; background: #eef2ff; }
    .km-box.physio { border-left-color: #0ea5e9; background: #f0f9ff; }
    .km-box.structure { border-left-color: #10b981; background: #ecfdf5; }
    .km-box.warning { border-left-color: #ef4444; background: #fef2f2; }
  </style>
<link rel="stylesheet" href="desktop.css" data-basecamp-typography>
<link rel="stylesheet" href="../assets/guide-report-theme.css">
</head>
<body class="antialiased">
  <div id="root"><p style="padding:32px">MPS 진료가이드를 불러오는 중입니다.</p></div>
